[project]
name = "DeepPlate"
version = "0.1.0"
description = "Multimodal Deep Learning for Calorie Estimation (educational project)"
authors = [
    {name = "Ollldman",email = "dodrolla@gmail.com"}
]

license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "torchsummary (>=1.5.1,<2.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "torchmetrics (>=1.8.2,<2.0.0)",
    "albumentations (>=2.0.8,<3.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "transformers (>=4.57.3,<5.0.0)",
    "timm (>=1.0.22,<2.0.0)",
    "ipython (>=9.8.0,<10.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)"
]

[tool.poetry]
packages = [
    { include = "DeepPlate" },
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
